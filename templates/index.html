<!-- templates/index.html -->
{% extends "base.html" %}
{% block title %}Accueil - AI Classifier{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow upload-card">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Classificateur d'Images IA</h1>
                        <p class="text-muted text-center mb-4">Uploader une image d'oiseau, chat ou chien</p>

                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form method="post" enctype="multipart/form-data" action="{{ url_for('predict') }}">
                            <div class="mb-3">
                                <input type="file" class="form-control" name="file" id="fileInput" accept=".png,.jpg,.jpeg">
                            </div>

                            <!-- Ajout de la prévisualisation -->
                            <div class="preview-box border-2 border-dashed rounded-3 p-4 mb-4 text-center">
                                <span class="text-muted">Aucune image sélectionnée</span>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-cloud-upload me-2"></i>
                                    Analyser l'image
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .upload-card {
            border-radius: 15px;
            transition: transform 0.3s ease;
        }
        .upload-card:hover {
            transform: translateY(-5px);
        }
        .preview-box {
            min-height: 200px;
            background-color: #f8f9fa;
            border-color: #dee2e6 !important;
        }
    </style>

    <script>
        // Preview image before upload
        const fileInput = document.getElementById('fileInput');
        const previewBox = document.querySelector('.preview-box');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewBox.innerHTML = `<img src="${e.target.result}" class="img-fluid" style="max-height: 300px;">`;
                }
                reader.readAsDataURL(file);
            } else {
                previewBox.innerHTML = '<span class="text-muted">Aucune image sélectionnée</span>';
            }
        });
    </script>
{% endblock %}
